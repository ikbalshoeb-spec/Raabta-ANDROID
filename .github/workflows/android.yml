name: Build Raabta APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract source
        run: unzip -q Raabta-Android-Source-Preview.zip
      - name: Use installed Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check reminder rules
        run: bash checks/run.sh
        working-directory: Raabta
      - name: Build and lint APK
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
        working-directory: Raabta
      - uses: actions/upload-artifact@v4
        with:
          name: Raabta-APK
          path: Raabta/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-reports
          path: Raabta/app/build/reports/
