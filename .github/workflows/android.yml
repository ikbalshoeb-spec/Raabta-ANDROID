name: Build Raabta APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract source
        run: unzip -q Raabta-Android-Source-Preview.zip
      - name: Use installed Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check reminder rules
        run: bash checks/run.sh
        working-directory: Raabta
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: raabta-design-debug-signing-v1
      - name: Build and lint APK
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
        working-directory: Raabta
      - uses: actions/upload-artifact@v4
        with:
          name: Raabta-APK
          path: Raabta/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-reports
          path: Raabta/app/build/reports/




      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render all screens on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash Raabta/checks/emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Raabta-design-screens
          path: design-screens/
